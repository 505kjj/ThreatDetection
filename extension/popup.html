<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Threat Monitor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="popup-container">
        <header class="popup-header">
            <div class="header-icon" aria-hidden="true">🛡️</div>
            <div class="header-text"><h1>Threat Monitor</h1></div>
        </header>
        <div class="status-bar" role="status">
            <span class="status-dot idle" id="statusDot"></span>
            <span id="statusText">Checking monitoring…</span>
        </div>
        <section class="section" aria-label="Current website">
            <div class="domain-display" id="currentDomain">—</div>
            <p class="section-desc" id="details"></p>
        </section>
        <section id="impersonationSection" class="risk-section" aria-label="Financial impersonation evidence" hidden>
            <div class="section-label">Address evidence</div>
            <ul id="impersonationReasons" class="reasons-list"></ul>
        </section>
        <section id="riskSection" class="risk-section" aria-label="Activity check details" hidden>
            <div class="section-label">Activity score</div>
            <p id="riskScore"></p>
            <ul id="reasonsList" class="reasons-list"></ul>
        </section>
        <div class="actions">
            <button class="btn btn-add" id="btnAddSite" hidden>Monitor this site</button>
            <button class="btn btn-remove" id="btnRemoveSite" hidden>Stop monitoring this site</button>
            <button class="btn btn-options" id="btnOptions">Settings</button>
        </div>
    </main>
    <script type="module" src="popup.js"></script>
</body>
</html>
