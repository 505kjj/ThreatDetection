spring.application.name=threat-detection
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8081}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.tomcat.accesslog.enabled=false
spring.mvc.log-request-details=false
spring.web.resources.add-mappings=false

# Temporary local database. The SQL console is disabled in all profiles.
spring.datasource.url=jdbc:h2:mem:threatdb
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Accept only documented JSON fields and types.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-null-for-primitives=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.mapper.allow-coercion-of-scalars=false
