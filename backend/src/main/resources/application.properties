# ============================================
# Generic Threat Detection System - Configuration
# ============================================

spring.application.name=threat-detection
server.port=${SERVER_PORT:8081}

# ============================================
# H2 Database (local demo - zero external setup)
# Switch to MySQL/PostgreSQL for production
# ============================================
spring.datasource.url=jdbc:h2:mem:threatdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================
# JPA / Hibernate
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# Logging
# ============================================
logging.level.com.example.threatdetection=INFO
logging.level.org.springframework.web=INFO
