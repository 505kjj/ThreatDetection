server.address=0.0.0.0
server.port=${PORT:10000}
server.tomcat.threads.min-spare=2
server.tomcat.threads.max=24
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=3

threat.security.allowed-origins[0]=${TD_RENDER_EXTENSION_ORIGIN}
threat.security.clients.demo-browser.role=BROWSER
threat.security.clients.demo-browser.token-sha256=${TD_RENDER_BROWSER_DIGEST}
threat.security.clients.demo-admin.role=ADMIN
threat.security.clients.demo-admin.token-sha256=${TD_RENDER_ADMIN_DIGEST}
threat.monitoring.synthetic-clients[0]=demo-browser
threat.monitoring.retention-days=14
threat.monitoring.postgres.jdbc-url=${TD_RENDER_NEON_JDBC_URL}
threat.monitoring.postgres.username=${TD_RENDER_NEON_USER}
threat.monitoring.postgres.password=${TD_RENDER_NEON_PASSWORD}
threat.monitoring.postgres.root-certificate=/etc/ssl/certs/ca-certificates.crt
threat.monitoring.postgres.pool-size=2
