name: Phase 8A release verification

on:
  pull_request:
    branches:
      - main
      - feature/phase-8a-release-preparation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Maven verification and runtime inventory
        working-directory: backend
        run: sh mvnw -B -ntp verify dependency:list -DincludeScope=runtime -DoutputFile=target/runtime-dependencies.txt
      - name: Scan Maven runtime advisories
        run: node scripts/check-maven-advisories.mjs backend/target/runtime-dependencies.txt
      - name: Extension, website and research verification
        run: |
          node --test --test-concurrency=1 extension/tests/*.test.mjs website/deployment.test.mjs
          node --test research/phase6c/*.test.mjs research/phase6d/*.test.mjs research/phase6e/*.test.mjs research/phase7b/*.test.mjs
          node website/build.mjs
          node scripts/check-frozen-receipts.mjs --public-only
          git diff --exit-code ec7d579 -- docs/experiments research evaluation
          ruby -ryaml -e '
            services = YAML.safe_load_file("render.yaml").fetch("services")
            abort "Expected one manual Free web service" unless services.length == 1
            web = services.fetch(0)
            abort "Invalid Render settings" unless web.values_at("plan", "autoDeployTrigger", "healthCheckPath") == ["free", "off", "/api/health"]
            abort "Missing Dockerfile" unless File.file?(web.fetch("dockerfilePath"))
            abort "Unexpected environment declaration" unless web.fetch("envVars").all? { |v| v["key"] == "SPRING_PROFILES_ACTIVE" ? v["value"] == "render" : v.keys.sort == %w[key sync] && v["sync"] == false }
          '
      - name: Scan release commits for secrets
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --max-time 60 -o "$archive" +            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --log-opts='ec7d579..HEAD'
      - name: Check Render image in a local runner container
        run: |
          docker build --file deploy/Dockerfile.render --tag threatdetection:ci .
          test "$(docker image inspect --format '{{.Config.User}}' threatdetection:ci)" = '10001:1000'
          trap 'docker rm -f threatdetection-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name threatdetection-ci --memory 512m --cpus 1 +            -e SERVER_ADDRESS=0.0.0.0 -e SERVER_PORT=10000 +            -p 127.0.0.1::10000 threatdetection:ci
          address="$(docker port threatdetection-ci 10000/tcp)"
          for i in {1..30}; do
            if curl --fail --silent --max-time 2 "http://$address/api/health"; then
              docker stats --no-stream --format '{{.MemUsage}}' threatdetection-ci
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 80 threatdetection-ci
          exit 1
